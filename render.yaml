services:
  - type: web
    name: resolveai-backend
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_DEBUG
        value: "True"
      - key: ALLOW_DEV_AUTH
        value: "True"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
